<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasteleria Mil Sabores | Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-mil-sabores sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Mil Sabores</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="catalog.html">Catalogo</a></li>
        <li class="nav-item"><a class="nav-link" href="description.html">Nosotros</a></li>
        <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">Mi cuenta</a></li>
        <li class="nav-item">
          <a class="nav-link position-relative" href="cart.html">Carrito
            <span class="badge rounded-pill badge-carrito contador-carrito position-absolute top-0 start-100 translate-middle">0</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<header class="hero-mil-sabores py-4">
  <div class="container">
    <h1 class="mb-0">Catalogo de productos</h1>
  </div>
</header>

<section class="seccion">
  <div class="container">
    <div class="row">
      <!-- FILTROS -->
      <aside class="col-lg-3 mb-4">
        <div class="card-producto p-3 sombra-suave">
          <h6 class="mb-3">Buscar</h6>
          <input type="search" id="inputBusqueda" class="form-control mb-4" placeholder="Ej: chocolate, torta...">

          <h6 class="mb-2">Categoria</h6>
          <select id="filtroCategoria" class="form-select mb-4">
            <option value="">Todas las categorias</option>
          </select>

          <h6 class="mb-2">Tipo de torta</h6>
          <select id="filtroTipo" class="form-select mb-4">
            <option value="">Todos los tipos</option>
            <option value="cuadrada">Cuadrada</option>
            <option value="circular">Circular</option>
            <option value="individual">Postre individual</option>
            <option value="tradicional">Pastelera tradicional</option>
          </select>

          <h6 class="mb-2">Ordenar por precio</h6>
          <select id="filtroOrden" class="form-select mb-4">
            <option value="">Relevancia</option>
            <option value="asc">Menor a mayor</option>
            <option value="desc">Mayor a menor</option>
          </select>

          <button class="btn btn-outline-mil-sabores w-100">Limpiar filtros</button>
        </div>
      </aside>

      <!-- RESULTADOS -->
      <div class="col-lg-9">
        <p id="contadorResultados" class="texto-secundario"></p>
        <div class="row g-4" id="grillaProductos"></div>
      </div>
    </div>
  </div>
</section>

<footer class="footer-mil-sabores">
  <div class="container text-center">
    <p class="mb-0 small"><span class="anio-actual"></span> Pasteleria Mil Sabores. FullStack II Grupo6.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
