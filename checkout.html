<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastelería Mil Sabores | Finalizar compra</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-mil-sabores sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Mil Sabores</a>
    <div class="ms-auto">
      <a href="cart.html" class="btn btn-outline-mil-sabores btn-sm"> Volver al carrito</a>
    </div>
  </div>
</nav>

<header class="hero-mil-sabores py-4">
  <div class="container"><h1 class="mb-0">Finalizar compra</h1></div>
</header>

<section class="seccion">
  <div class="container">
    <div class="row g-4">
      <div class="col-lg-7">
        <form class="form-mil-sabores card-producto p-4" id="formCheckout">
          <h5 class="mb-3">Datos de entrega</h5>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nombre completo</label>
              <input type="text" class="form-control" id="chkNombre" required>
              <div class="invalid-feedback">Ingresa tu nombre completo.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Telefono de contacto</label>
              <input type="tel" class="form-control" id="chkTelefono" required>
              <div class="invalid-feedback">Ingresa un telefono de contacto.</div>
            </div>
            <div class="col-12">
              <label class="form-label">Direccion de entrega</label>
              <input type="text" class="form-control" id="chkDireccion" placeholder="Calle, número, comuna" required>
              <div class="invalid-feedback">Ingresa la direccion de entrega.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Fecha de entrega preferida</label>
              <input type="date" class="form-control" id="chkFecha" required>
              <div class="invalid-feedback">Selecciona una fecha de entrega.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label">Horario preferido</label>
              <select class="form-select">
                <option>Mañana (9:00 - 13:00)</option>
                <option>Tarde (14:00 - 18:00)</option>
                <option>Noche (18:00 - 21:00)</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Metodo de pago</label>
              <select class="form-select">
                <option>Webpay (debito / credito)</option>
                <option>Transferencia bancaria</option>
                <option>Efectivo contra entrega</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-mil-sabores btn-lg w-100 mt-4">Confirmar pedido y generar boleta</button>
        </form>
      </div>

      <div class="col-lg-5">
        <div class="card-producto p-4 sombra-suave">
          <h5 class="mb-3">Resumen</h5>
          <div id="resumenItems"></div>
          <hr>
          <div class="d-flex justify-content-between mb-2"><span>Subtotal</span><span id="chkSubtotal">$0</span></div>
          <div class="d-flex justify-content-between mb-2 texto-secundario" id="chkFilaDescuento" style="display:none;">
            <span id="chkEtiquetaDescuento">Descuento</span><span id="chkDescuento">-$0</span>
          </div>
          <div class="d-flex justify-content-between mb-2"><span>Envio</span><span>Gratis</span></div>
          <hr>
          <div class="d-flex justify-content-between fs-5 fw-bold"><span>Total</span><span id="chkTotal">$0</span></div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="footer-mil-sabores">
  <div class="container text-center">
    <p class="mb-0 small"><span class="anio-actual"></span>Pasteleria Mil Sabores. FullStack II Grupo6.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/Js/products-data.js"></script>
<script src="assets/Js/cart.js"></script>
<script src="assets/Js/checkout.js"></script>
</body>
</html>
